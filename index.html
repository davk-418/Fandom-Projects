<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="description" content="Search selected EPUB books for words and phrases." />
  <title>Book Searcher</title>

  <link
    href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap"
    rel="stylesheet"
  />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.0/jszip.min.js"></script>

  <style>
    :root {
      --bg: #ffffff;
      --surface: #ffffff;
      --surface-2: #f7f8fa;
      --surface-3: #eef1f5;
      --text: #111111;
      --muted: #666666;
      --border: #e1e4e8;
      --border-strong: #c8cdd3;
      --accent: #0b5fff;
      --accent-hover: #084dcc;
      --accent-soft: #dbe9ff;
      --success: #18794e;
      --success-soft: #dcfce7;
      --warning: #946200;
      --warning-soft: #fff3cd;
      --danger: #b00020;
      --danger-soft: #ffe3e8;
      --shadow: 0 8px 30px rgba(0,0,0,.14);
      --radius: 8px;
      --font: "Merriweather", Georgia, serif;
    }

    [data-theme="dark"] {
      color-scheme: dark;
      --bg: #101214;
      --surface: #171a1e;
      --surface-2: #1d2126;
      --surface-3: #252a31;
      --text: #f1f3f5;
      --muted: #a8afb8;
      --border: #30363d;
      --border-strong: #484f58;
      --accent: #6ea8ff;
      --accent-hover: #8ab8ff;
      --accent-soft: #203b68;
      --success: #63d391;
      --success-soft: #163b28;
      --warning: #f1c75b;
      --warning-soft: #413613;
      --danger: #ff7b91;
      --danger-soft: #451923;
      --shadow: 0 8px 30px rgba(0,0,0,.4);
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--text);
      transition: background .2s ease, color .2s ease;
    }

    button,
    input,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: .55;
    }

    :focus-visible {
      outline: 3px solid color-mix(in srgb, var(--accent) 45%, transparent);
      outline-offset: 2px;
    }

    .app {
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    .sidebar {
      background: var(--surface-2);
      border-right: 1px solid var(--border);
      padding: 1rem;
      width: 300px;
      min-width: 220px;
      max-width: 520px;
      flex: 0 0 300px;
      overflow: auto;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      margin-bottom: .75rem;
    }

    .sidebar-header h2 {
      margin: 0;
    }

    .resizer {
      width: 7px;
      cursor: col-resize;
      background: var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }

    .resizer::before {
      content: "⇔";
      font-size: 12px;
      color: var(--muted);
    }

    .main {
      flex: 1;
      min-width: 0;
      padding: 1.25rem;
      overflow: auto;
    }

    .main-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }

    h1,
    h2,
    h3 {
      margin: 0 0 .5rem;
    }

    h1 {
      font-size: 1.65rem;
    }

    .muted {
      color: var(--muted);
      font-size: .9rem;
    }

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }

    .toolbar {
      display: flex;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
    }

    .controls {
      display: flex;
      gap: .5rem;
      margin: .5rem 0 1rem;
      flex-wrap: wrap;
    }

    .btn,
    .controls button,
    .toolbar button,
    .search-btn,
    .sort-select,
    .page-size-select {
      padding: .5rem .75rem;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: .88rem;
    }

    .btn:hover,
    .controls button:hover,
    .toolbar button:hover,
    .sort-select:hover,
    .page-size-select:hover {
      background: var(--surface-3);
    }

    .btn-primary,
    .search-btn {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .btn-primary:hover,
    .search-btn:hover {
      background: var(--accent-hover);
    }

    .btn-danger {
      background: var(--danger);
      color: white;
      border-color: var(--danger);
    }

    .search-filter,
    .search-bar,
    .option-input {
      width: 100%;
      padding: .6rem .7rem;
      border: 1px solid var(--border-strong);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
      font-size: .9rem;
    }

    .search-filter {
      margin-bottom: .75rem;
    }

    .search-area {
      margin-top: .75rem;
      padding: .75rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .search-row {
      display: flex;
      gap: .5rem;
      align-items: stretch;
    }

    .search-bar {
      flex: 1;
      min-width: 180px;
    }

    .search-btn {
      white-space: nowrap;
    }

    .search-options {
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      margin-top: .7rem;
      font-size: .86rem;
    }

    .search-options label {
      display: flex;
      align-items: center;
      gap: .35rem;
      cursor: pointer;
    }

    .dropdown {
      margin-bottom: .55rem;
    }

    .dropdown-header {
      display: flex;
      align-items: center;
      gap: .5rem;
      padding: .45rem;
      border-radius: 6px;
      background: var(--surface-3);
      cursor: pointer;
      user-select: none;
    }

    .dropdown-header:hover {
      background: var(--accent-soft);
    }

    .dropdown-header input {
      flex: 0 0 auto;
    }

    .arrow {
      width: 18px;
      text-align: center;
      display: inline-block;
    }

    .dropdown-content {
      display: none;
      margin-top: .35rem;
      padding-left: .25rem;
    }

    .dropdown-content.open {
      display: block;
    }

    .dropdown-content label,
    .author-btn {
      display: block;
      margin: .2rem 0;
      padding: .3rem .45rem .3rem 1rem;
      border-radius: 6px;
      transition: background .15s ease;
    }

    .dropdown-content label:hover,
    .author-btn:hover {
      background: var(--surface-3);
    }

    .dropdown-content label.selected,
    .author-btn.selected {
      background: var(--accent-soft);
    }

    .authors-section {
      margin-top: 1.25rem;
      border-top: 1px solid var(--border);
      padding-top: 1rem;
    }

    .authors-header {
      font-weight: 700;
      margin-bottom: .5rem;
    }

    .library-status {
      margin-top: 1rem;
      padding: .75rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: .82rem;
    }

    .library-status.success {
      border-color: color-mix(in srgb, var(--success) 45%, var(--border));
    }

    .library-status.warning {
      border-color: color-mix(in srgb, var(--warning) 45%, var(--border));
    }

    .recent-searches {
      margin-top: 1rem;
    }

    .recent-search {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
      text-align: left;
      margin: .25rem 0;
      padding: .45rem .55rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      background: var(--surface);
      color: var(--text);
    }

    .recent-search:hover {
      background: var(--surface-3);
    }

    .results-toolbar {
      display: none;
      gap: .5rem;
      align-items: center;
      flex-wrap: wrap;
      margin: 1rem 0 .75rem;
      padding: .6rem;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .results-toolbar.visible {
      display: flex;
    }

    .results-toolbar .spacer {
      flex: 1;
    }

    #results {
      margin-top: .75rem;
    }

    .search-status {
      padding: .8rem;
      margin-bottom: .75rem;
      border: 1px solid var(--border);
      background: var(--surface-2);
      border-radius: var(--radius);
    }

    .progress-track {
      height: 8px;
      background: var(--surface-3);
      border-radius: 99px;
      overflow: hidden;
      margin: .6rem 0;
    }

    .progress-bar {
      height: 100%;
      width: 0;
      background: var(--accent);
      transition: width .15s ease;
    }

    .spinner {
      width: 26px;
      height: 26px;
      border: 3px solid var(--surface-3);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: .25rem auto;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
      gap: .5rem;
      margin: .75rem 0;
    }

    .stat {
      padding: .7rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .stat-value {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .stat-label {
      color: var(--muted);
      font-size: .78rem;
      margin-top: .15rem;
    }

    .series-block {
      margin-bottom: 1rem;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .65rem;
      background: var(--surface);
    }

    .series-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .75rem;
      cursor: pointer;
      padding: .3rem;
      border-radius: 6px;
    }

    .series-header:hover {
      background: var(--surface-2);
    }

    .series-books {
      display: none;
      margin-top: .6rem;
    }

    .series-books.open {
      display: block;
    }

    .book-card {
      margin: .6rem 0;
      padding: .65rem;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      background: linear-gradient(180deg, var(--surface), var(--surface-2));
    }

    .book-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .6rem;
      cursor: pointer;
      padding: .25rem;
      border-radius: 6px;
    }

    .book-header:hover {
      background: var(--surface-3);
    }

    .book-title {
      font-weight: 700;
    }

    .book-meta {
      font-size: .82rem;
      color: var(--muted);
      margin-top: .15rem;
    }

    .book-actions {
      display: flex;
      gap: .35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .book-actions button {
      padding: .3rem .5rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
      font-size: .76rem;
    }

    .chapters-list {
      display: none;
      margin-top: .55rem;
      padding-left: .25rem;
    }

    .chapters-list.open {
      display: block;
    }

    .chapter-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: .5rem;
      padding: .5rem;
      border-radius: 6px;
      background: var(--surface-2);
      margin: .3rem 0;
      cursor: pointer;
      border: 1px solid transparent;
    }

    .chapter-row:hover {
      border-color: var(--border-strong);
      background: var(--surface-3);
    }

    .occ-container {
      display: none;
      padding: .35rem .6rem .6rem;
    }

    .occ-container.open {
      display: block;
    }

    .occurrence-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: .5rem;
      flex-wrap: wrap;
      margin: .4rem 0;
    }

    .occurrence-btn {
      display: block;
      width: 100%;
      text-align: left;
      margin: .25rem 0;
      padding: .55rem;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      border-radius: 6px;
    }

    .occurrence-btn:hover {
      background: var(--accent-soft);
    }

    .highlight-sentence {
      background: var(--accent-soft);
      padding: .7rem;
      border-radius: 6px;
      margin-bottom: .5rem;
      line-height: 1.65;
    }

    .context-sentence {
      color: var(--muted);
      line-height: 1.6;
      margin-bottom: .5rem;
    }

    .error-box {
      padding: .7rem;
      color: var(--danger);
      background: var(--danger-soft);
      border-radius: 6px;
      font-size: .85rem;
    }

    .warning-box {
      padding: .7rem;
      color: var(--warning);
      background: var(--warning-soft);
      border-radius: 6px;
      font-size: .85rem;
    }

    .success-box {
      padding: .7rem;
      color: var(--success);
      background: var(--success-soft);
      border-radius: 6px;
      font-size: .85rem;
    }

    .empty-state {
      padding: 2rem 1rem;
      text-align: center;
      color: var(--muted);
      border: 1px dashed var(--border-strong);
      border-radius: var(--radius);
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: .4rem;
      flex-wrap: wrap;
      margin-top: .7rem;
    }

    .pagination button {
      padding: .4rem .6rem;
      border: 1px solid var(--border);
      border-radius: 5px;
      background: var(--surface);
      color: var(--text);
    }

    .pagination button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }

    .pagination-info {
      color: var(--muted);
      font-size: .8rem;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      align-items: center;
      justify-content: center;
      background: rgba(0,0,0,.55);
      z-index: 9999;
      padding: 1rem;
    }

    .modal-backdrop.is-open {
      display: flex;
    }

    .modal {
      width: min(900px, 96vw);
      max-height: 85vh;
      overflow: auto;
      background: var(--surface);
      color: var(--text);
      border-radius: var(--radius);
      padding: 1rem;
      box-shadow: var(--shadow);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }

    .modal-actions {
      display: flex;
      gap: .4rem;
      flex-wrap: wrap;
      margin: .75rem 0;
    }

    .modal-close {
      flex: 0 0 auto;
    }

    .toast {
      position: fixed;
      bottom: 1rem;
      right: 1rem;
      z-index: 11000;
      padding: .65rem .9rem;
      background: var(--text);
      color: var(--bg);
      border-radius: 6px;
      box-shadow: var(--shadow);
      opacity: 0;
      transform: translateY(10px);
      pointer-events: none;
      transition: opacity .2s ease, transform .2s ease;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .mobile-sidebar-toggle {
      display: none;
    }

    .validation-list {
      margin: .5rem 0 0;
      padding-left: 1.2rem;
    }

    @media (max-width: 800px) {
      .app {
        display: block;
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }

      .sidebar {
        width: auto;
        max-width: none;
        max-height: 55vh;
        border-right: 0;
        border-bottom: 1px solid var(--border);
        display: none;
      }

      .sidebar.mobile-open {
        display: block;
      }

      .resizer {
        display: none;
      }

      .mobile-sidebar-toggle {
        display: inline-block;
      }

      .main {
        padding: .9rem;
        overflow: visible;
      }

      .search-row {
        flex-direction: column;
      }

      .search-btn {
        width: 100%;
      }

      .book-header {
        align-items: flex-start;
      }

      .book-actions {
        flex-direction: column;
      }

      .main-header {
        align-items: flex-start;
      }
    }

    @media (max-width: 500px) {
      .stats {
        grid-template-columns: repeat(2, 1fr);
      }

      .search-options {
        flex-direction: column;
        gap: .45rem;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <aside class="sidebar" id="sidebar" aria-label="Book selection">
      <div class="sidebar-header">
        <h2>Library</h2>
        <button
          type="button"
          class="mobile-sidebar-toggle btn"
          id="closeSidebarBtn"
          aria-label="Close library"
        >Close</button>
      </div>

      <label class="sr-only" for="seriesSearch">Filter series</label>
      <input
        id="seriesSearch"
        class="search-filter"
        type="search"
        placeholder="Filter series..."
        autocomplete="off"
      />

      <div class="controls">
        <button type="button" id="selectAll">Select All</button>
        <button type="button" id="deselectAll">Deselect All</button>
        <button type="button" id="validateLibrary">Check Files</button>
      </div>

      <div id="seriesList"></div>

      <section class="authors-section" aria-labelledby="authorsHeading">
        <div class="authors-header" id="authorsHeading">Authors</div>
        <div id="authorList"></div>
      </section>

      <section class="library-status" id="libraryStatus" aria-live="polite">
        Library status has not been checked.
      </section>

      <section class="recent-searches" aria-labelledby="recentHeading">
        <div class="authors-header" id="recentHeading">Recent Searches</div>
        <div id="recentSearchList"></div>
      </section>
    </aside>

    <div class="resizer" id="resizer" title="Drag to resize" aria-hidden="true"></div>

    <main class="main">
      <header class="main-header">
        <div>
          <h1>Book Searcher</h1>
          <div class="muted">
            Search selected EPUB books for words, phrases, and occurrences.
          </div>
        </div>

        <div class="toolbar">
          <button type="button" class="btn mobile-sidebar-toggle" id="openSidebarBtn">
            Library
          </button>

          <button
            type="button"
            class="btn"
            id="themeBtn"
            aria-label="Toggle dark mode"
            title="Toggle dark mode"
          >
            🌙
          </button>
        </div>
      </header>

      <section class="search-area" aria-label="Search">
        <div class="search-row">
          <label class="sr-only" for="searchQuery">Search query</label>
          <input
            id="searchQuery"
            class="search-bar"
            type="search"
            placeholder="Enter a word or phrase"
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="searchBtn" class="search-btn">
            Search
          </button>
          <button type="button" id="cancelSearchBtn" class="btn-danger" hidden>
            Cancel
          </button>
        </div>

        <div class="search-options">
          <label>
            <input id="wholeWordOption" type="checkbox" checked />
            Whole word
          </label>

          <label>
            <input id="caseSensitiveOption" type="checkbox" />
            Case sensitive
          </label>

          <label>
            <input id="flexiblePhraseOption" type="checkbox" checked />
            Flexible phrase spacing
          </label>

          <label>
            <input id="searchTitlesOption" type="checkbox" />
            Search chapter titles
          </label>
        </div>
      </section>

      <div id="searchStatus" class="search-status" hidden aria-live="polite"></div>

      <div id="resultsControls" class="results-toolbar">
        <button type="button" id="expandAllResults">Expand All</button>
        <button type="button" id="collapseAllResults">Collapse All</button>

        <label>
          Sort:
          <select id="sortSelect" class="sort-select">
            <option value="library">Book order</option>
            <option value="alpha">Alphabetical</option>
            <option value="most">Most matches</option>
            <option value="least">Fewest matches</option>
          </select>
        </label>

        <label>
          Occurrences:
          <select id="pageSizeSelect" class="page-size-select">
            <option value="25">25</option>
            <option value="50" selected>50</option>
            <option value="100">100</option>
            <option value="200">200</option>
          </select>
        </label>

        <div class="spacer"></div>

        <button type="button" id="clearResultsBtn">Clear Results</button>
      </div>

      <div id="results"></div>
    </main>
  </div>

  <div
    id="occurrenceModal"
    class="modal-backdrop"
    aria-hidden="true"
    role="presentation"
  >
    <div
      class="modal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="modalTitle"
      tabindex="-1"
      id="modalDialog"
    >
      <div class="modal-header">
        <div>
          <div id="modalTitle" style="font-weight:700"></div>
          <div id="modalSubtitle" class="muted"></div>
        </div>

        <button
          type="button"
          class="btn modal-close"
          id="modalClose"
          aria-label="Close occurrence"
        >
          Close
        </button>
      </div>

      <div class="modal-actions">
        <button type="button" class="btn" id="copySentenceBtn">
          Copy Sentence
        </button>
        <button type="button" class="btn" id="copyContextBtn">
          Copy Context
        </button>
      </div>

      <div id="modalContent" style="font-size:1rem;line-height:1.5"></div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script>
  /*
   * ============================================================
   * BOOK SEARCHER — UPDATED VERSION
   * ============================================================
   *

      '"': "&quot;",

  /* ============================================================
     EPUB cache
     ============================================================ */

  const epubCache = new Map();

  function clearEpubCache() {
    epubCache.clear();
  }

  async function getEpubZip(url, signal) {
    if (epubCache.has(url)) {
      return epubCache.get(url);
    }

    const promise = (async () => {
      const response = await fetch(url, {
        signal,
        cache: "force-cache"
      });

      if (!response.ok) {
        throw new Error(`File unavailable (HTTP ${response.status})`);
      }

      const arrayBuffer = await response.arrayBuffer();

      if (!arrayBuffer || arrayBuffer.byteLength < 100) {
        throw new Error("EPUB is empty or corrupted");
      }

      return JSZip.loadAsync(arrayBuffer);
    })();

    epubCache.set(url, promise);

    try {
      return await promise;
    } catch (error) {
      epubCache.delete(url);
      throw error;
    }
  }

  /* ============================================================
     Robust EPUB path resolution
     ============================================================ */

  function normalizeEpubPath(path) {
    const parts = [];

    String(path)
      .split("/")
      .forEach(part => {
        if (!part || part === ".") return;

        if (part === "..") {
          parts.pop();
        } else {
          parts.push(part);
        }
      });

    return decodeURIComponent(parts.join("/"));
  }

  function resolveEpubPath(basePath, href) {
    if (!href) return "";

    const cleanHref = href.split("#")[0];

    const baseDirectory =
      String(basePath).replace(/[^/]+$/, "");

    return normalizeEpubPath(
      `${baseDirectory}${cleanHref}`
    );
  }

  /* ============================================================
     EPUB container
     ============================================================ */

  async function findOpfPath(zip) {
    const entry = zip.files["META-INF/container.xml"];

    if (!entry) {
      return null;
    }

    const text = await entry.async("text");

    const parser = new DOMParser();
    const doc = parser.parseFromString(text, "application/xml");

    const rootfile =
      doc.querySelector("rootfile[full-path]");

    return rootfile?.getAttribute("full-path") || null;
  }

  /* ============================================================
     EPUB OPF
     ============================================================ */

  function parseOpf(opfText, opfPath) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(
      opfText,
      "application/xml"
    );

    const manifest = {};
    const spine = [];

    doc.querySelectorAll("manifest > item").forEach(item => {
      const id = item.getAttribute("id");
      const href = item.getAttribute("href");

      if (!id || !href) return;

      manifest[id] = {
        href: resolveEpubPath(opfPath, href),
        mediaType: item.getAttribute("media-type") || "",
        properties: item.getAttribute("properties") || ""
      };
    });

    doc.querySelectorAll("spine > itemref").forEach(itemref => {
      const idref = itemref.getAttribute("idref");

      if (idref) {
        spine.push(idref);
      }
    });

    let ncxHref = null;

    const ncxItem = Array.from(
      doc.querySelectorAll("manifest > item")
    ).find(item =>
      /application\/x-dtbncx\+xml/i.test(
        item.getAttribute("media-type") || ""
      )
    );

    if (ncxItem) {
      ncxHref = resolveEpubPath(
        opfPath,
        ncxItem.getAttribute("href")
      );
    }

    return {
      manifest,
      spine,
      ncxHref
    };
  }

  /* ============================================================
     Navigation
     ============================================================ */

  function parseNcx(ncxText, ncxPath) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(
      ncxText,
      "application/xml"
    );

    return Array.from(doc.querySelectorAll("navPoint"))
      .map(navPoint => {
        const label =
          navPoint.querySelector("navLabel > text");

        const content =
          navPoint.querySelector("content");

        const title =
          label?.textContent?.trim() || "";

        const src =
          content?.getAttribute("src") || "";

        if (!src) return null;

        return {
          href: resolveEpubPath(ncxPath, src),
          title
        };
      })
      .filter(Boolean);
  }

  function parseNavToc(navText, navPath) {
    const parser = new DOMParser();
    const doc = parser.parseFromString(
      navText,
      "text/html"
    );

    const nav =
      doc.querySelector(
        'nav[epub\\:type="toc"]'
      ) ||
      doc.querySelector('nav[role="doc-toc"]') ||
      doc.querySelector("nav");

    if (!nav) {
      return [];
    }

    return Array.from(
      nav.querySelectorAll("a[href]")
    )
      .map(anchor => {
        const href =
          anchor.getAttribute("href");

        if (!href) return null;

        return {
          href: resolveEpubPath(navPath, href),
          title:
            normalizeWhitespace(
              anchor.textContent
            )
        };
      })
      .filter(Boolean);
  }

  /* ============================================================
     EPUB metadata + spine
     ============================================================ */

  async function getChapterInfo(zip, opfPath) {
    if (!opfPath || !zip.files[opfPath]) {
      return {
        titleMap: new Map(),
        spineOrder: []
      };
    }

    const opfText =
      await zip.files[opfPath].async("text");

    const {
      manifest,
      spine,
      ncxHref
    } = parseOpf(opfText, opfPath);

    let navEntries = [];

    for (const id of Object.keys(manifest)) {
      const item = manifest[id];

      const isNav =
        item.properties.includes("nav") ||
        (
          /xhtml/i.test(item.mediaType) &&
          /nav/i.test(item.href)
        );

      if (!isNav) continue;

      if (!zip.files[item.href]) continue;

      const navText =
        await zip.files[item.href].async("text");

      navEntries =
        parseNavToc(navText, item.href);

      if (navEntries.length) {
        break;
      }
    }

    if (
      !navEntries.length &&
      ncxHref &&
      zip.files[ncxHref]
    ) {
      const ncxText =
        await zip.files[ncxHref].async("text");

      navEntries =
        parseNcx(ncxText, ncxHref);
    }

    const titleMap = new Map();

    navEntries.forEach(entry => {
      titleMap.set(
        normalizeEpubPath(entry.href),
        entry.title
      );
    });

    const spineOrder = [];

    spine.forEach(idref => {
      const item = manifest[idref];

      if (!item?.href) return;

      const path =
        normalizeEpubPath(item.href);

      spineOrder.push(path);

      if (!titleMap.has(path)) {
        titleMap.set(
          path,
          path.split("/").pop() || "Chapter"
        );
      }
    });

    if (!spineOrder.length) {
      Object.keys(zip.files).forEach(path => {
        if (!/\.x?html?$/i.test(path)) return;

        if (!isContentFile(path)) return;

        const normalized =
          normalizeEpubPath(path);

        spineOrder.push(normalized);

        if (!titleMap.has(normalized)) {
          titleMap.set(
            normalized,
            normalized.split("/").pop()
          );
        }
      });
    }

    return {
      titleMap,
      spineOrder
    };
  }

  function isContentFile(path) {
    const lower = path.toLowerCase();

    if (!/\.x?html?$/i.test(lower)) {
      return false;
    }

    return !(
      /nav/.test(lower) ||
      /toc/.test(lower) ||
      /cover/.test(lower) ||
      /titlepage/.test(lower) ||
      /acknowledg/.test(lower) ||
      /contents/.test(lower) ||
      /manifest/.test(lower)
    );
  }

  /* ============================================================
     XHTML extraction
     ============================================================ */

  function extractXhtmlText(raw) {
    const parser = new DOMParser();

    const doc =
      parser.parseFromString(raw, "text/html");

    doc.querySelectorAll(
      "script,style,nav,aside,header,footer"
    ).forEach(el => el.remove());

    const body =
      doc.body || doc.documentElement;

    return normalizeWhitespace(
      body?.innerText ||
      body?.textContent ||
      ""
    );
  }

  function extractDocumentTitle(raw, fallback) {
    const parser = new DOMParser();

    const doc =
      parser.parseFromString(raw, "text/html");

    const heading =
      doc.querySelector("h1,h2,h3");

    if (heading?.textContent) {
      const title =
        normalizeWhitespace(
          heading.textContent
        );

      if (title) {
        return title;
      }
    }

    const title =
      doc.querySelector("title");

    if (title?.textContent) {
      const value =
        normalizeWhitespace(
          title.textContent
        );

      if (value) {
        return value;
      }
    }

    return fallback;
  }

  /* ============================================================
     Search regex
     ============================================================ */

  function buildQueryRegex(
    query,
    {
      wholeWord = true,
      caseSensitive = false,
      flexiblePhrase = true
    } = {}
  ) {
    let escaped =
      escapeRegExp(
        normalizeWhitespace(query)
      );

    if (flexiblePhrase) {
      escaped = escaped.replace(
        /\\ +/g,
        "\\s+"
      );
    }

    let prefix = "";
    let suffix = "";

    if (wholeWord) {
      prefix =
        "(?<![A-Za-z0-9])";

      suffix =
        "(?![A-Za-z0-9])";
    }

    return new RegExp(
      `${prefix}(${escaped})${suffix}`,
      caseSensitive ? "g" : "gi"
    );
  }

  /* ============================================================
     Worker
     ============================================================ */

  let searchWorker = null;
  let workerRequestId = 0;
  const workerRequests = new Map();

  function createSearchWorker() {
    if (searchWorker) {
      return searchWorker;
    }

    const workerCode = `
      function normalizeWhitespace(value) {
        return String(value)
          .replace(/\\\\u00a0/g, " ")
          .replace(/\\\\s+/g, " ")
          .trim();
      }

      function escapeRegExp(value) {
        return value.replace(/[.*+?^\\\\$\\\\{\\\\}()|[\\\\]\\\\\\\\]/g, "\\\\\\\\$&");
      }

      function buildRegex(query, options) {
        let escaped =
          escapeRegExp(normalizeWhitespace(query));

        if (options.flexiblePhrase) {
          escaped =
            escaped.replace(/\\\\\\\\ +/g, "\\\\\\\\s+");
        }

        let prefix = "";
        let suffix = "";

        if (options.wholeWord) {
          prefix = "(?<![A-Za-z0-9])";
          suffix = "(?![A-Za-z0-9])";
        }

        return new RegExp(
          prefix + "(" + escaped + ")" + suffix,
          options.caseSensitive ? "g" : "gi"
        );
      }

      function truncate(value, max) {
        if (!value) return "";
        return value.length <= max
          ? value
          : value.slice(0, max) + "...";
      }

      self.onmessage = function(event) {
        const {
          id,
          type,
          text,
          query,
          options
        } = event.data;

        try {
          if (type === "count") {
            const regex =
              buildRegex(query, options);

            const matches =
              Array.from(text.matchAll(regex));

            self.postMessage({
              id,
              type: "countResult",
              totalMatches: matches.length
            });

            return;
          }

          if (type === "occurrences") {
            const regex =
              buildRegex(query, options);

            const sentenceRegex =
              /[^.!?]+[.!?]?/g;

            const sentences = [];

            let sentenceMatch;

            while (
              (sentenceMatch =
                sentenceRegex.exec(text)) !== null
            ) {
              const sentence =
                sentenceMatch[0].trim();

              if (!sentence) continue;

              sentences.push({
                text: sentence,
                start: sentenceMatch.index,
                end:
                  sentenceMatch.index +
                  sentenceMatch[0].length
              });
            }

            if (!sentences.length) {
              sentences.push({
                text,
                start: 0,
                end: text.length
              });
            }

            const matches =
              Array.from(text.matchAll(regex));

            const occurrences =
              matches.map(match => {
                const index =
                  match.index ?? 0;

                let sentenceIndex = 0;

                while (
                  sentenceIndex <
                    sentences.length &&
                  !(
                    index >=
                      sentences[sentenceIndex].start &&
                    index <
                      sentences[sentenceIndex].end
                  )
                ) {
                  sentenceIndex++;
                }

                if (
                  sentenceIndex >=
                  sentences.length
                ) {
                  sentenceIndex =
                    sentences.length - 1;
                }

                const current =
                  sentences[sentenceIndex];

                const previous =
                  sentences[sentenceIndex - 1];

                const next =
                  sentences[sentenceIndex + 1];

                const escaped =
                  current.text.replace(
                    /[&<>"']/g,
                    function(c) {
                      return {
                        "&":"&amp;",
                        "<":"&lt;",
                        ">":"&gt;",
                        '"':"&quot;",
                        "'":"&#39;"
                      }[c];
                    }
                  );

                const highlighted =
                  escaped.replace(
                    regex,
                    "<strong>$1</strong>"
                  );

                return {
                  matchIndex: index,
                  prev: truncate(
                    previous?.text || "",
                    options.maxSentenceLength
                  ),
                  curr: truncate(
                    current.text,
                    options.maxSentenceLength
                  ),
                  next: truncate(
                    next?.text || "",
                    options.maxSentenceLength
                  ),
                  matchHtml: highlighted
                };
              });

            self.postMessage({
              id,
              type: "occurrenceResult",
              occurrences
            });
          }
        } catch(error) {
          self.postMessage({
            id,
            type: "error",
            error:
              error?.message ||
              "Worker search failed"
          });
        }
      };
    `;

    const blob =
      new Blob([workerCode], {
        type: "application/javascript"
      });

    searchWorker =
      new Worker(
        URL.createObjectURL(blob)
      );

    searchWorker.onmessage =
      event => {
        const result = event.data;
        const resolver =
          workerRequests.get(result.id);

        if (!resolver) return;

        workerRequests.delete(result.id);

        if (result.type === "error") {
          resolver.reject(
            new Error(result.error)
          );
        } else {
          resolver.resolve(result);
        }
      };

    return searchWorker;
  }

  function workerRequest(type, payload) {
    return new Promise((resolve, reject) => {
      const worker =
        createSearchWorker();

      const id =
        ++workerRequestId;

      workerRequests.set(id, {
        resolve,
        reject
      });

      worker.postMessage({
        id,
        type,
        ...payload
      });
    });
  }

  /* ============================================================
     EPUB analysis
     ============================================================ */

  async function analyzeBook(
    url,
    query,
    options,
    signal
  ) {
    try {
      const zip =
        await getEpubZip(url, signal);

      if (signal?.aborted) {
        throw new DOMException(
          "Search cancelled",
          "AbortError"
        );
      }

      const opfPath =
        await findOpfPath(zip);

      const {
        titleMap,
        spineOrder
      } = await getChapterInfo(
        zip,
        opfPath
      );

      const chapters = [];

      let totalMatches = 0;
      let chapterIndex = 0;

      for (const path of spineOrder) {
        if (signal?.aborted) {
          throw new DOMException(
            "Search cancelled",
            "AbortError"
          );
        }

        if (!isContentFile(path)) {
          continue;
        }

        const entry =
          zip.files[path];

        if (!entry || entry.dir) {
          continue;
        }

        const raw =
          await entry.async("text");

        const text =
          extractXhtmlText(raw);

        if (!text) {
          continue;
        }

        const fallback =
          `Chapter ${++chapterIndex}`;

        const chapterTitle =
          (
            titleMap.get(path) ||
            extractDocumentTitle(
              raw,
              fallback
            )
          ).trim() || fallback;

        let chapterMatches = 0;

        if (options.searchTitles) {
          const titleRegex =
            buildQueryRegex(
              query,
              options
            );

          chapterMatches =
            Array.from(
              chapterTitle.matchAll(
                titleRegex
              )
            ).length;
        }

        const workerResult =
          await workerRequest(
            "count",
            {
              text,
              query,
              options
            }
          );

        chapterMatches +=
          workerResult.totalMatches;

        if (chapterMatches > 0) {
          chapters.push({
            name: chapterTitle,
            path,
            chapterTotalMatches:
              chapterMatches
          });

          totalMatches +=
            chapterMatches;
        }
      }

      return {
        ok: true,
        chapters,
        totalMatches
      };

    } catch(error) {
      if (
        error?.name ===
        "AbortError"
      ) {
        throw error;
      }

      return {
        ok: false,
        error:
          error?.message ||
          "Unable to parse EPUB"
      };
    }
  }

  async function extractOccurrencesForChapter(
    url,
    chapterPath,
    query,
    options,
    signal
  ) {
    try {
      const zip =
        await getEpubZip(url, signal);

      const normalized =
        normalizeEpubPath(
          chapterPath
        );

      const entryKey =
        Object.keys(zip.files)
          .find(key =>
            normalizeEpubPath(
              key.split("#")[0]
            ) === normalized
          );

      if (!entryKey) {
        return {
          ok: false,
          error: "Chapter not found in EPUB"
        };
      }

      const raw =
        await zip.files[entryKey]
          .async("text");

      const text =
        extractXhtmlText(raw);

      if (!text) {
        return {
          ok: true,
          occurrences: [],
          totalMatches: 0
        };
      }

      const result =
        await workerRequest(
          "occurrences",
          {
            text,
            query,
            options: {
              ...options,
              maxSentenceLength:
                options.maxSentenceLength ||
                400
            }
          }
        );

      return {
        ok: true,
        occurrences:
          result.occurrences,
        totalMatches:
          result.occurrences.length
      };

    } catch(error) {
      if (
        error?.name ===
        "AbortError"
      ) {
        throw error;
      }

      return {
        ok: false,
        error:
          error?.message ||
          "Unable to extract occurrences"
      };
    }
  }

  function getSeriesElements(series) {
    const wrapper =
      Array.from(
        document.querySelectorAll(

  function setSeriesChecked(
    series,
    checked
  ) {
    const elements =
      getSeriesElements(series);

    if (!elements) return;

    elements.parent.checked =
      checked;

    elements.parent.indeterminate =
      false;

    elements.books.forEach(book => {
      book.checked =
        checked;

      book.closest("label")
        ?.classList.toggle(
          "selected",
          checked
        );
    });

    updateSeriesState(series);
  }

  function updateSeriesState(series) {
    const elements =
      getSeriesElements(series);

    if (!elements) return;

    const count =
      elements.books.filter(
        book => book.checked
      ).length;

    elements.parent.checked =
      count === elements.books.length &&
      count > 0;

    elements.parent.indeterminate =
      count > 0 &&
      count < elements.books.length;

    elements.parent
      .closest(".dropdown-header")
      ?.setAttribute(
        "aria-label",
        count === 0
          ? `Select ${series}`
          : count === elements.books.length
            ? `Deselect ${series}`
            : `${count} of ${elements.books.length} books selected in ${series}`
      );
  }

  function updateAuthorStates() {
    authors.forEach(author => {
      const seriesNames =
        authorsMap[author] || [];

      const seriesStates =
        seriesNames.map(series => {
          const elements =
            getSeriesElements(series);

          if (!elements) {
            return {
              checked: false,
              partial: false
            };
          }

          return {
            checked:
              elements.parent.checked,
            partial:
              elements.parent.indeterminate
          };
        });

      const allChecked =
        seriesStates.length > 0 &&
        seriesStates.every(
          state => state.checked
        );

      const anyChecked =
        seriesStates.some(
          state =>
            state.checked ||
            state.partial
        );

      const input =
        document.querySelector(
          `.author[value="${cssEscapeSafe(author)}"]`
        );

      if (!input) return;

      input.checked =
        allChecked;

      input.indeterminate =
        anyChecked &&
        !allChecked;

      input.closest("label")
        ?.classList.toggle(
          "selected",
          anyChecked
        );
    });
  }

  /* ============================================================
     Group targets
     ============================================================ */

  function buildGroupedTargets(
    selection
  ) {
    const groups =
      new Map();

    function addSeries(
      seriesName,
      books
    ) {
      if (!groups.has(seriesName)) {
        groups.set(
          seriesName,
          new Map()
        );
      }

      const bookMap =
        groups.get(seriesName);

      books.forEach(book => {
        bookMap.set(
          book.title,
          {
            title: book.title,
            filename:
              fileForTitle(book.title)
          }
        );
      });
    }

    selection.selectedSeries
      .forEach(series => {
        addSeries(
          series,
          (catalog[series] || [])
            .map(title => ({ title }))
        );
      });

    selection.selectedAuthors
      .forEach(author => {
        (authorsMap[author] || [])
          .forEach(series => {
            addSeries(
              series,
              (catalog[series] || [])
                .map(title => ({ title }))
            );
          });
      });

    selection.selectedBooks
      .forEach(book => {
        addSeries(
          book.series,
          [{ title: book.title }]
        );
      });

    return Array.from(
      groups,
      ([seriesName, books]) => ({
        seriesName,
        books:
          Array.from(
            books.values()
          )
      })
    );
  }

  /* ============================================================
     Controlled concurrency
     ============================================================ */

  async function mapConcurrent(
    items,
    limit,
    worker,
    signal,
    progress
  ) {
    const results =
      new Array(items.length);

    let nextIndex = 0;

    async function runner() {
      while (true) {
        if (signal.aborted) {
          throw new DOMException(
            "Search cancelled",
            "AbortError"
          );
        }

        const index =
          nextIndex++;

        if (index >= items.length) {
          return;
        }

        results[index] =
          await worker(
            items[index],
            index
          );

        if (progress) {
          progress(
            results[index],
            index
          );
        }
      }
    }

    const runners =
      Array.from(
        {
          length: Math.min(
            limit,
            items.length
          )
        },
        () => runner()
      );

    await Promise.all(
      runners
    );

    return results;
  }

  /* ============================================================
     Search
     ============================================================ */

  async function performSearch() {
    const queryRaw =
      searchInput.value.trim();

    if (!queryRaw) {
      resultsDiv.innerHTML =
        `<div class="error-box">Please enter a search term.</div>`;

      return;
    }

    if (
      /^[\\p{P}\\p{S}]$/u.test(
        queryRaw
      )
    ) {
      resultsDiv.innerHTML =
        `<div class="error-box">Queries cannot consist of only one symbol.</div>`;

      return;
    }

    const selection =
      getSelection();

    const targets =
      buildGroupedTargets(
        selection
      );

    if (!targets.length) {
      resultsDiv.innerHTML =
        `<div class="error-box">Please choose a series, book, or author to search.</div>`;

      return;
    }

    activeSearchController?.abort();

    const controller =
      new AbortController();

    activeSearchController =
      controller;

    setSearchBusy(true);

    resultsControls.classList.remove(
      "visible"
    );

    resultsDiv.innerHTML =
      '<div class="spinner"></div>';

    const options =
      getSearchOptions();

    const allBooks =
      targets.flatMap(
        group =>
          group.books.map(book => ({
            ...book,
            seriesName:
              group.seriesName
          }))
      );

    let completed = 0;
    let matchesFound = 0;

    updateSearchProgress(
      0,
      allBooks.length,
      0
    );

    try {
      const bookResults =
        await mapConcurrent(
          allBooks,
          4,
          async book => {
            const result =
              await analyzeBook(
                rawUrlForFile(
                  book.filename
                ),
                queryRaw,
                options,
                controller.signal
              );

            return {
              ...book,
              counts: result
            };
          },
          controller.signal,
          result => {
            completed++;

            if (
              result?.counts?.ok
            ) {
              matchesFound +=
                result.counts
                  .totalMatches;
            }

            updateSearchProgress(
              completed,
              allBooks.length,
              matchesFound
            );
          }
        );

      if (
        controller.signal.aborted
      ) {
        return;
      }

      const grouped =
        new Map();

      bookResults.forEach(
        result => {
          if (!grouped.has(
            result.seriesName
          )) {
            grouped.set(
              result.seriesName,
              []
            );
          }

          grouped
            .get(result.seriesName)
            .push(result);
        }
      );

      const groupedData =
        Array.from(
          grouped,
          ([seriesName, books]) => ({
            seriesName,
            books
          })
        );

      const stats =
        calculateStatistics(
          groupedData
        );

      currentSearchData = {
        query: queryRaw,
        options,
        groupedData,
        stats
      };

      localStorage.setItem(
        STORAGE_KEYS.query,
        queryRaw
      );

      saveRecentSearch(
        queryRaw
      );

      renderSearchResults();

      finishSearchStatus(
        `Search complete — ${pluralize(stats.totalMatches, "match")} found.`
      );

    } catch(error) {
      if (
        error?.name ===
        "AbortError"
      ) {
        searchStatus.hidden =
          false;

        searchStatus.innerHTML =
          `<div class="warning-box">Search cancelled.</div>`;

        resultsDiv.innerHTML =
          `<div class="empty-state">Search cancelled.</div>`;

        return;
      }

      console.error(error);

      searchStatus.hidden =
        false;

      searchStatus.innerHTML =
        `<div class="error-box">Search failed: ${escapeHtml(error?.message || "Unknown error")}</div>`;

      resultsDiv.innerHTML =
        `<div class="error-box">Unable to complete the search.</div>`;

    } finally {
      if (
        activeSearchController ===
        controller
      ) {
        activeSearchController =
          null;
      }

      setSearchBusy(false);
    }
  }

  /* ============================================================
     Statistics
     ============================================================ */

  function calculateStatistics(
    groupedData
  ) {
    const books =
      groupedData.flatMap(
        group => group.books
      );

    const validBooks =
      books.filter(
        book =>
          book.counts.ok
      );

    const matchingBooks =
      validBooks.filter(
        book =>
          book.counts.totalMatches > 0
      );

    const chapters =
      validBooks.reduce(
        (total, book) =>
          total +
          book.counts.chapters.length,
        0
      );

    const totalMatches =
      validBooks.reduce(
        (total, book) =>
          total +
          book.counts.totalMatches,
        0
      );

    const errors =
      books.filter(
        book =>
          !book.counts.ok
      ).length;

    return {
      booksSearched:
        books.length,

      matchingBooks:
        matchingBooks.length,

      chapters,

      totalMatches,

      errors
    };
  }

  /* ============================================================
     Sorting
     ============================================================ */

  function sortGroupedData(
    groupedData
  ) {
    const mode =
      sortSelect.value;

    const copy =
      groupedData.map(group => ({
        ...group,
        books:
          [...group.books]
      }));

    if (mode === "alpha") {
      copy.sort(
        (a, b) =>
          a.seriesName.localeCompare(
            b.seriesName
          )
      );

      copy.forEach(group => {
        group.books.sort(
          (a, b) =>
            a.title.localeCompare(
              b.title
            )
        );
      });
    }

    if (mode === "most") {
      copy.forEach(group => {
        group.books.sort(
          (a, b) =>
            (b.counts.totalMatches || 0) -
            (a.counts.totalMatches || 0)
        );
      });

      copy.sort(
        (a, b) =>
          totalForGroup(b) -
          totalForGroup(a)
      );
    }

    if (mode === "least") {
      copy.forEach(group => {
        group.books.sort(
          (a, b) =>
            (a.counts.totalMatches || 0) -
            (b.counts.totalMatches || 0)
        );
      });

      copy.sort(
        (a, b) =>
          totalForGroup(a) -
          totalForGroup(b)
      );
    }

    return copy;
  }

  function totalForGroup(
    group
  ) {
    return group.books.reduce(
      (sum, book) =>
        sum +
        (
          book.counts.ok
            ? book.counts.totalMatches
            : 0
        ),
      0
    );
  }

  function renderGroupedResults(
    container,
    groupedData,
    query
  ) {
    container.innerHTML = "";

    if (!groupedData.length) {
      container.innerHTML =
        `<div class="empty-state">No results to display.</div>`;

      return;
    }

    groupedData.forEach(
      seriesBlock => {
        const seriesTotal =
          totalForGroup(
            seriesBlock
          );

        const valid =
          seriesBlock.books.some(
            book =>
              book.counts.ok
          );

        const errors =
          seriesBlock.books.some(
            book =>
              !book.counts.ok
          );

        const seriesDiv =
          document.createElement("section");

        seriesDiv.className =
          "series-block";

        const header =
          document.createElement("div");

        header.className =
          "series-header";

        header.innerHTML = `
          <div>
            <strong>
              ${escapeHtml(
                seriesBlock.seriesName
              )}
            </strong>
          </div>

          <div class="muted">
            ${
              valid
                ? pluralize(
                    seriesTotal,
                    "match"
                  )
                : errors
                  ? "File errors"
                  : "No matches"
            }
          </div>
        `;

        const booksContainer =
          document.createElement("div");

        booksContainer.className =
          "series-books";

        header.addEventListener(
          "click",
          () => {

          booksContainer

        seriesBlock.books.forEach(
          book => {
            renderBook(
              booksContainer,
              seriesBlock.seriesName,
              book,
              query,
              currentSearchData.options
            );
          }
        );

        container.appendChild(
          seriesDiv
        );
      }

  /* ============================================================
     Chapter rendering
     ============================================================ */

  function renderChapter(
    container,
    book,
    chapter,
    query,
    options
  ) {
    const row =
      document.createElement("div");

    row.className =
      "chapter-row";

    row.innerHTML = `
      <div>
        ${escapeHtml(chapter.name)}
      </div>

      <div class="muted">
        ${pluralize(
          chapter.chapterTotalMatches,
          "occurrence"
        )}
      </div>
    `;

    const occurrenceContainer =
      document.createElement("div");

    occurrenceContainer.className =
      "occ-container";

    const loadButton =
      document.createElement("button");

    loadButton.type =
      "button";

    loadButton.className =
      "btn";

    loadButton.textContent =
      "Load occurrences";

    const showAllButton =
      document.createElement("button");

    showAllButton.type =
      "button";

    showAllButton.className =
      "btn";

    showAllButton.textContent =
      "Show all";

    const controls =
      document.createElement("div");

    controls.className =
      "occurrence-controls";

    const info =
      document.createElement("span");

    info.className =
      "muted";

    info.textContent =
      `${pluralize(
        chapter.chapterTotalMatches,
        "occurrence"
      )}`;

    controls.append(
      info,
      loadButton,
      showAllButton
    );

    occurrenceContainer.append(
      controls
    );

    let loaded =
      false;

    let occurrences = [];

    let currentPage = 1;

    let pageSize =
      Number(
        pageSizeSelect.value
      );

    async function loadOccurrences(
      requestedPageSize
    ) {
      loadButton.disabled =
        true;

      showAllButton.disabled =
        true;

      occurrenceContainer
        .querySelectorAll(
          ".occurrence-list,.pagination"
        )
        .forEach(
          element =>
            element.remove()
        );

      const spinner =
        document.createElement("div");

      spinner.className =
        "spinner";

      occurrenceContainer.appendChild(
        spinner
      );

      try {
        const result =
          await extractOccurrencesForChapter(
            rawUrlForFile(
              book.filename
            ),
            chapter.path,
            query,
            {
              ...options,
              maxSentenceLength: 400
            }
          );

        spinner.remove();

        if (!result.ok) {
          occurrenceContainer.insertAdjacentHTML(
            "beforeend",
            `<div class="error-box">
              ${escapeHtml(
                result.error ||
                "Unable to load occurrences"
              )}
            </div>`
          );

          return;
        }

        occurrences =
          result.occurrences;

        loaded = true;

        pageSize =
          requestedPageSize ||
          Number(
            pageSizeSelect.value
          );

        currentPage = 1;

        renderOccurrencePage();

      } catch(error) {
        spinner.remove();

        occurrenceContainer.insertAdjacentHTML(
          "beforeend",
          `<div class="error-box">
            ${escapeHtml(
              error?.message ||
              "Unable to load occurrences"
            )}
          </div>`
        );

      } finally {
        loadButton.disabled =
          false;

        showAllButton.disabled =
          false;
      }
    }

    function renderOccurrencePage() {
      occurrenceContainer
        .querySelectorAll(
          ".occurrence-list,.pagination"
        )
        .forEach(
          element =>
            element.remove()
        );

      const list =
        document.createElement("div");

      list.className =
        "occurrence-list";

      const total =
        occurrences.length;

      const totalPages =
        Math.max(
          1,
          Math.ceil(
            total / pageSize
          )
        );

      currentPage =
        Math.max(
          1,
          Math.min(
            currentPage,
            totalPages
          )
        );

      const start =
        (currentPage - 1) *
        pageSize;

      const end =
        Math.min(
          start + pageSize,
          total
        );

      const pageItems =
        occurrences.slice(
          start,
          end
        );

      if (!pageItems.length) {
        list.innerHTML = `
          <div class="muted">
            No occurrences found.
          </div>
        `;
      }

      pageItems.forEach(
        (occurrence, index) => {
          const button =
            document.createElement("button");

          button.type =
            "button";

          button.className =
            "occurrence-btn";

          const number =
            start + index + 1;

          button.innerHTML = `
            <strong>
              Occurrence ${number}
            </strong>
            —
            <span class="muted">
              ${escapeHtml(
                occurrence.curr.slice(
                  0,
                  120
                )
              )}
              ${
                occurrence.curr.length > 120
                  ? "..."
                  : ""
              }
            </span>
          `;

          button.addEventListener(
            "click",
            event => {
              event.stopPropagation();

              showOccurrenceModal(
                book.title,
                chapter.name,
                number,
                occurrence.prev,
                occurrence.curr,
                occurrence.matchHtml,
                occurrence.next
              );
            }
          );

          list.appendChild(
            button
          );
        }
      );

      occurrenceContainer.appendChild(
        list
      );

      if (totalPages > 1) {
        const pagination =
          document.createElement("div");

        pagination.className =
          "pagination";

        const previous =
          document.createElement("button");

        previous.type =
          "button";

        previous.textContent =
          "Previous";

        previous.disabled =
          currentPage === 1;

        previous.addEventListener(
          "click",
          event => {
            event.stopPropagation();

            currentPage--;

            renderOccurrencePage();
          }
        );

        const next =
          document.createElement("button");

        next.type =
          "button";

        next.textContent =
          "Next";

        next.disabled =
          currentPage === totalPages;

        next.addEventListener(
          "click",
          event => {
            event.stopPropagation();

            currentPage++;

            renderOccurrencePage();
          }
        );

        const pageInfo =
          document.createElement("span");

        pageInfo.className =
          "pagination-info";

        pageInfo.textContent =
          `${start + 1}–${end} of ${total} · Page ${currentPage} of ${totalPages}`;

        pagination.append(
          previous,
          pageInfo,
          next
        );

        occurrenceContainer.appendChild(
          pagination
        );
      }
    }

    loadButton.addEventListener(
      "click",
      event => {
        event.stopPropagation();

        if (!loaded) {
          loadOccurrences();
        } else {
          currentPage = 1;
          renderOccurrencePage();
        }
      }
    );

    showAllButton.addEventListener(
      "click",
      event => {
        event.stopPropagation();

        if (!loaded) {
          loadOccurrences(
            Number.MAX_SAFE_INTEGER
          );
        } else {
          pageSize =
            occurrences.length ||
            1;

          currentPage = 1;

          renderOccurrencePage();
        }
      }
    );

    row.addEventListener(
      "click",
      event => {
        if (
          event.target ===
          loadButton ||
          event.target ===
          showAllButton
        ) {
          return;
        }

        occurrenceContainer.classList.toggle(
          "open"
        );

        if (
          occurrenceContainer.classList.contains(
            "open"
          ) &&
          !loaded
        ) {
          loadOccurrences();
        }
      }
    );

    container.append(
      row,
      occurrenceContainer
    );
  }

  const modal =

  let modalData = null;

  function openModal() {
    previousFocusedElement =
      document.activeElement;

    modal.classList.add(
      "is-open"
    );

    modal.setAttribute(
      "aria-hidden",
      "false"
    );

    requestAnimationFrame(
      () =>
        modalDialog.focus()
    );
  }

  function closeModal() {
    modal.classList.remove(
      "is-open"
    );

    modal.setAttribute(
      "aria-hidden",
      "true"
    );

    if (
      previousFocusedElement &&
      typeof previousFocusedElement
        .focus === "function"
    ) {
      previousFocusedElement.focus();
    }
  }

  modalClose.addEventListener(
    "click",
    closeModal
  );

  modal.addEventListener(

      if (
        event.target === modal

        closeModal();

  /* ============================================================

  const libraryStatus =

  async function validateLibrary() {
    libraryStatus.className =
      "library-status";

    libraryStatus.innerHTML =
      `<div class="spinner"></div>
       <div>Checking EPUB files…</div>`;

    const allBooks =
      Object.values(catalog)
        .flat();

    let completed = 0;
    let available = 0;
    const missing = [];

    for (
      const title of allBooks
    ) {
      const filename =
        fileForTitle(title);

      const url =
        rawUrlForFile(filename);

      try {
        const response =
          await fetch(
            url,
            {
              method: "HEAD",
              cache: "no-store"
            }
          );

        if (response.ok) {
          available++;
        } else {
          missing.push({
            title,
            status:
              response.status
          });
        }

      } catch {
        missing.push({
          title,
          status:
            "network error"
        });
      }

      completed++;

      libraryStatus.innerHTML =
        `<div>
          Checking ${completed} of ${allBooks.length}…
        </div>`;
    }

    if (!missing.length) {
      libraryStatus.className =
        "library-status success";

      libraryStatus.innerHTML =
        `<strong>✓ Library ready</strong>
         <br>${available} EPUB files available.`;

      return;
    }

    libraryStatus.className =
      "library-status warning";

    const list =
      missing
        .slice(0, 15)
        .map(
          item =>
            `<li>${escapeHtml(
              item.title
            )} (${escapeHtml(
              item.status
            )})</li>`
        )
        .join("");

    libraryStatus.innerHTML =
      `<strong>⚠ ${missing.length} file(s) unavailable</strong>
       <br>${available} of ${allBooks.length} files available.
       <ul class="validation-list">${list}</ul>
       ${
         missing.length > 15
           ? `<div class="muted">Only the first 15 are shown.</div>`
           : ""
       }`;
  }

  if (
    !document.querySelector(
      ".book:checked,.series-parent:checked,.author:checked"
    )
  ) {
    const firstDropdown =
      document.querySelector(
        ".dropdown"
      );

    if (firstDropdown) {
      firstDropdown
        .querySelector(
          ".dropdown-content"
        )
        ?.classList.add(
          "open"
        );

      firstDropdown
        .querySelector(
          ".arrow"
        ).textContent = "▼";
    }
  }

  /*
   * Update selection state after initialization.
   */
  Object.keys(catalog)
    .forEach(
      updateSeriesState
    );

  updateAuthorStates();

  /*
   * Warn before accidentally leaving a
   * running search.
   */
  window.addEventListener(
    "beforeunload",
    event => {
      if (
        activeSearchController
      ) {
        event.preventDefault();
        event.returnValue = "";
      }
    }
  );

  /*
   * If the worker crashes, reject pending
   * requests so the UI doesn't hang indefinitely.
   */
  if (searchWorker) {
    searchWorker.onerror =
      error => {
        console.error(
          "Search worker error:",
          error
        );

        workerRequests.forEach(
          request => {
            request.reject(
              new Error(
                "Search worker stopped unexpectedly."
              )
            );
          }
        );

        workerRequests.clear();
      };
  }

  /*
   * Expose a small debugging API.
   * Useful from DevTools without affecting
   * normal operation.
   */
  window.BookSearcher = {
    clearEpubCache,
    getSelection,
    getRecentSearches,
    validateLibrary,
    clearResults() {
      currentSearchData = null;
      resultsDiv.innerHTML = "";
      resultsControls.classList.remove(
        "visible"
      );
    },
    aliases,
    catalog,
    authorsMap
  };
  </script>
</body>
</html>
